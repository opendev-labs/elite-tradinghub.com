<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <!-- Green Bull Head Profile (Left) -->
  <g transform="translate(180, 40) scale(0.95)">
    <path d="M120,130 C100,70 60,30 20,40 C10,42 0,55 15,65 C45,85 75,115 90,145 Z" fill="url(#emeraldGrad)" />
    <path d="M170,120 C185,60 215,25 250,20 C260,18 270,30 258,42 C230,70 205,105 195,138 Z" fill="url(#emeraldGrad)" />
    <path d="M90,145 C70,165 65,195 80,225 C95,255 125,275 145,280 C165,275 195,255 210,225 C225,195 220,165 200,145 C180,165 110,165 90,145 Z" fill="none" stroke="url(#emeraldGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M125,235 C135,245 155,245 165,235" fill="none" stroke="#26d98a" stroke-width="6" stroke-linecap="round" />
    <path d="M110,200 L135,210 L120,220" fill="none" stroke="#26d98a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M180,200 L155,210 L170,220" fill="none" stroke="#26d98a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Ascending 3D Candlestick Chart Bars (Right side of Bull) -->
  <g transform="translate(420, 70)">
    <line x1="25" y1="20" x2="25" y2="210" stroke="#26d98a" stroke-width="4" />
    <polygon points="10,60 40,40 40,170 10,190" fill="url(#barGrad2)" stroke="#26d98a" stroke-width="2" />
    <polygon points="40,40 50,48 50,178 40,170" fill="#047857" />

    <line x1="85" y1="0" x2="85" y2="230" stroke="#26d98a" stroke-width="4" />
    <polygon points="70,30 100,10 100,190 70,210" fill="url(#barGrad1)" stroke="#34d399" stroke-width="2" />
    <polygon points="100,10 112,18 112,198 100,190" fill="#059669" />

    <line x1="145" y1="-30" x2="145" y2="240" stroke="#34d399" stroke-width="4" />
    <polygon points="130,0 160,-20 160,170 130,190" fill="url(#emeraldGrad)" stroke="#6ee7b7" stroke-width="2" />
    <polygon points="160,-20 175,-10 175,180 160,170" fill="#10b981" />
  </g>

  <!-- ELITE Text with Accent Line -->
  <text x="400" y="380" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="110" fill="#ffffff" text-anchor="middle" letter-spacing="18">ELITE</text>
  <rect x="522" y="285" width="62" height="12" fill="#26d98a" rx="2" />

  <!-- TRADING HUB Text -->
  <text x="400" y="455" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="44" fill="#26d98a" text-anchor="middle" letter-spacing="22">TRADING HUB</text>

  <!-- Tagline: TRADE. GROW. SUCCEED. -->
  <line x1="180" y1="495" x2="620" y2="495" stroke="#ffffff" stroke-width="3" opacity="0.8" />
  <text x="400" y="535" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="24" fill="#e8edf0" text-anchor="middle" letter-spacing="14">TRADE. GROW. SUCCEED.</text>
</svg>